name: Compilar PDF EV-PRAC-01
on:
  push:
    branches: [main]
    paths:
      - 'EV-PRAC-01/main.tex'
      - '.github/workflows/compilar-evaluacion.yml'

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar LaTeX
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended
      - name: Compilar
        run: |
          cd EV-PRAC-01
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - name: Guardar PDF generado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EV-PRAC-01/main.pdf
          if git diff --cached --quiet; then
            echo 'El PDF ya esta actualizado'
          else
            git commit -m 'build: actualizar PDF compilado de EV-PRAC-01'
            git push origin HEAD:main
          fi
